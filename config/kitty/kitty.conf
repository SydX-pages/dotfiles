# ── Splits ─────────────────────────────────────────────────────────────
# Choose the split direction. It is stored as a user var on the focused
# pane and inherited by the panes split from it later.
#   ctrl+alt+h  new pane side by side (left/right)
#   ctrl+alt+v  new pane stacked (top/bottom)
map ctrl+alt+h remote_control set-user-vars split_axis=vsplit
map ctrl+alt+v remote_control set-user-vars split_axis=hsplit

# Split the active pane in the remembered direction. The `goto_layout`
# part makes sure the splits layout is active so --location takes effect
# (splits is enabled by default); without a remembered direction the
# axis is chosen automatically.
map ctrl+shift+enter combine : goto_layout splits : launch --location=split --cwd=current
map --when-focus-on var:split_axis=vsplit ctrl+shift+enter combine : goto_layout splits : launch --location=vsplit --var split_axis=vsplit --cwd=current
map --when-focus-on var:split_axis=hsplit ctrl+shift+enter combine : goto_layout splits : launch --location=hsplit --var split_axis=hsplit --cwd=current
