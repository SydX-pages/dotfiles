### foot 配置，参考 ~/.config/kitty/kitty.conf 转换而来
###   font_family monospace / font_size 11  -> font=monospace:size=11
###   bold/italic/bold-italic auto          -> 同名 font-* 项
###   cursor_shape beam                     -> [cursor] style=beam
###   background_opacity 0.7                -> [colors] alpha=0.7
###   color0-7 / color8-15                  -> regular0-7 / bright0-7(+8-15)
###   map ctrl+shift+c/v                    -> key-bindings clipboard-copy/paste
### 本机 foot 1.21 (Debian) 不支持：font-ligatures、[tabs] 标签栏、
###   key-bindings 的 send 动作，所以
###   disable_ligatures / tab 样式 / ctrl+h j k l / ctrl+shift+h l 这几项无法照搬。
###   另：kitty.conf 里没有 include，dank-theme.conf、dank-tabs.conf 其实没生效，
###   想用那套配色见文件末尾注释块。

[main]
font=monospace:size=9
font-bold=monospace:bold:size=9
font-italic=monospace:italic:size=9
font-bold-italic=monospace:bold:italic:size=9
# dpi-aware=yes：sway 输出是 scale 1.75 的分数缩放。之前这里是 no，foot 会按固定
# 96dpi 算格子尺寸（11pt -> 14.67px），和 compositor 给的 logical 尺寸对不上，窗口
# 收到 configure 后可能反复算出更小的尺寸，表现就是「浮动后高度自己往 0 缩、最后
# 窗口关掉」。改完必须重开 foot 才生效，旧窗口保留旧设置。
dpi-aware=yes
term=xterm-256color
pad=6x6

[colors]
alpha=0.7
background=0b0b1e
foreground=c4c6c5
selection-foreground=0b0b1e
selection-background=c4c6c5

## Normal/regular colors (0-7)
regular0=0d0d20
regular1=b24ca6
regular2=5ac38b
regular3=a68bff
regular4=897292
regular5=b46abf
regular6=4fc3dc
regular7=c2c2c7

## Bright colors (8-15)
bright0=7a7a99
bright1=e17fff
bright2=85e5b1
bright3=c8b6ff
bright4=cfa7ff
bright5=ff9cff
bright6=80eaff
bright7=f0f0f7

[cursor]
style=beam
# kitty: cursor #c4c6c5 —— 本版 foot 的 [cursor] color 解析有问题，先用 colors 里的前景色

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
spawn-terminal=Control+Shift+n
scrollback-up-page=Shift+Page_Up Shift+KP_Page_Up
scrollback-down-page=Shift+Page_Down Shift+KP_Page_Down
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

# ==== 想换成 kitty 目录里那套 "dank" 配色（dank-theme.conf / dank-tabs.conf）时，
